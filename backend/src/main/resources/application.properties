server.port=8080
server.max-http-request-header-size=1048576

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/towntrek_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&allowMultiQueries=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Aravdaksh2007.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
